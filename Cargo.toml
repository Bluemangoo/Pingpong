[package]
name = "pingpong"
version = "0.3.3"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.88"
log = "0.4.27"
pingora = { version = "0.8.1", features = ["proxy", "lb", "openssl"] }
structopt = "0.3.26"
toml = "1.1.4+spec-1.1.0"
serde = { version = "1.0.219", features = ["derive"] }
simplelog = "0.12.2"
anyhow = "1.0.98"
regex = "1.11.1"
http = "1.3.1"
urlencoding = "2.1.3"
once_cell = "1.21.3"

[profile.minimum]
inherits = "release"
lto = true
opt-level = 'z'
codegen-units = 1
